<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <title>Order form</title>
</head>

<body>

    <!-- Bestelpagina -->
    <header class="header fade-in">
        <img src="logo.png" alt="OnlyCATS Logo" class="logo fade-in">
        <nav class="nav fade-in">
            <div class="nav-list fade-in">
                <a href="index.html">Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Order</a>
            </div>
        </nav>
    </header>

    <section class="cart-section fade-in">
        <h1>Your Order Form</h1>
        <p>Here you can put in your order details and proceed to checkout.</p>

        <form action="Order.html" method="post" id="orderForm">
            <div class="PersonalInformation fade-in">
                <label id="aanhef" class="pronouns">Title:</label>
                <input type="radio" id="ms" name="aanhef" value="Ms.">
                <label for="ms" class="Ms">Ms.</label>
                <input type="radio" id="mr" name="aanhef" value="Mr.">
                <label for="mr" class="Mr">Mr.</label>
                <input type="radio" id="Other" name="aanhef" value="Other">
                <label for="Other" class="Other">Other</label><br>
            </div>

            <label for="name" class="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="First name" required>
            <input type="text" id="middle-name" name="middle-name" placeholder="Middle name">
            <input type="text" id="last-name" name="last-name" placeholder="Last name" required><br>
            <div class="Information fade-in">


                <label for="email" class="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Somebody@example.com" required><br>
                <label for="phone" class="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="+316 123456789" required><br>
                <label for="date" class="date">Date of Birth:</label>
                <input type="date" id="date" name="date" required><br>
                <label for="adress" class="adress">Adress:</label>
                <input type="text" id="adress" name="adress" placeholder="Sunstreet" required>
                <input type="text" id="housenumber" name="housenumber" placeholder="123" required><br>
                <label id="Postalcode" class="postal-code">Postal Code:</label>
                <input type="text" name="Postalcode" placeholder="1234 AB" required><br>
                <label for="country" class="country">Country:</label>
                <select id="country" name="country" required>
                    <option value="">Select a country</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="United States">United States</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                </select><br>
                <label for="payment" class="payment">Payment Method:</label>
                <select id="payment" name="payment" required>
                    <option value="">Select a payment method</option>
                    <option value="credit-card">Credit Card</option>
                    <option value="paypal">PayPal</option>
                    <option value="IDeal">IDeal</option>
                    <option value="bank-transfer">Bank Transfer</option>
                    <option value="cash-on-delivery">Cash on Delivery</option>

                </select><br>

                <label for="terms" class="terms">I agree to the terms and conditions:</label>
                <input type="checkbox" id="terms" name="terms" required>
                <br>
                <input type="submit" class="OrderButton" value="Place Order">
            </div>

        </form>

    </section>

    <footer class="footer fade-in">
        <p>&copy; 2026 OnlyCATS. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
